openapi: 3.2.0
info:
  title: Amazon FinSpace Environments Kdb Databases API
  description: 'Amazon FinSpace is a data management and analytics service for the financial services industry. NOTE: AWS announced end of support effective October 7, 2026. This API provides access to FinSpace environments, datasets, and Managed kdb Insights analytics environments.'
  version: '2021-03-12'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/contact-us/
  termsOfService: https://aws.amazon.com/service-terms/
  x-generated-from: documentation
  x-last-validated: '2026-04-19'
  x-deprecated: 'End of support: October 7, 2026'
servers:
- url: https://finspace.{region}.amazonaws.com
  description: Amazon FinSpace Regional Endpoint
  variables:
    region:
      default: us-east-1
      description: AWS Region
security:
- aws_signature_v4: []
tags:
- name: Kdb Databases
  description: Manage kdb databases
paths:
  /kdb/environments/{environmentId}/databases:
    post:
      operationId: createKxDatabase
      summary: Amazon FinSpace Create kdb Database
      description: Creates a new kdb database in the environment.
      tags:
      - Kdb Databases
      parameters:
      - name: environmentId
        in: path
        required: true
        description: kdb environment ID
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKxDatabaseRequest'
            examples:
              CreateKxDatabaseReq:
                summary: Default
                x-microcks-default: true
                value:
                  databaseName: equities-db
                  clientToken: token-abc123
      responses:
        '200':
          description: Database created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KxDatabase'
              examples:
                createKxDatabase200Example:
                  summary: Default
                  x-microcks-default: true
                  value:
                    environmentId: kdbenv-abc123
                    databaseName: equities-db
                    createdTimestamp: '2026-04-19T12:00:00Z'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    get:
      operationId: listKxDatabases
      summary: Amazon FinSpace List kdb Databases
      description: Returns a list of all the databases created in the kdb environment.
      tags:
      - Kdb Databases
      parameters:
      - name: environmentId
        in: path
        required: true
        description: kdb environment ID
        schema:
          type: string
      - name: nextToken
        in: query
        description: Pagination token
        schema:
          type: string
      - name: maxResults
        in: query
        description: Max results
        schema:
          type: integer
      responses:
        '200':
          description: Databases listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListKxDatabasesResponse'
              examples:
                listKxDatabases200Example:
                  summary: Default
                  x-microcks-default: true
                  value:
                    kxDatabases:
                    - environmentId: kdbenv-abc123
                      databaseName: equities-db
                      createdTimestamp: '2026-04-19T12:00:00Z'
                    nextToken: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    KxDatabase:
      type: object
      description: A kdb database
      properties:
        environmentId:
          type: string
          description: Parent environment ID
        databaseName:
          type: string
          description: Database name
          example: equities-db
        description:
          type: string
          description: Description
        createdTimestamp:
          type: string
          format: date-time
          description: Creation timestamp
        lastModifiedTimestamp:
          type: string
          format: date-time
          description: Last modified
        numBytes:
          type: integer
          description: Size in bytes
        numChangesets:
          type: integer
          description: Number of changesets
        numFiles:
          type: integer
          description: Number of files
    ListKxDatabasesResponse:
      type: object
      description: Response from ListKxDatabases
      properties:
        kxDatabases:
          type: array
          items:
            $ref: '#/components/schemas/KxDatabase'
        nextToken:
          type: string
          description: Pagination token
    ErrorResponse:
      type: object
      description: Error response from Amazon FinSpace
      properties:
        message:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
    CreateKxDatabaseRequest:
      type: object
      required:
      - databaseName
      - clientToken
      description: Request to create a kdb database
      properties:
        databaseName:
          type: string
          description: Name
        description:
          type: string
          description: Description
        tags:
          type: object
          additionalProperties:
            type: string
        clientToken:
          type: string
          description: Idempotency token
  securitySchemes:
    aws_signature_v4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4
externalDocs:
  description: Amazon FinSpace API Reference
  url: https://docs.aws.amazon.com/finspace/latest/management-api/fs-api-welcome.html
