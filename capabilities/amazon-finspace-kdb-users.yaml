naftiko: 1.0.0-alpha2
info:
  label: Amazon FinSpace API — Kdb Users
  description: 'Amazon FinSpace API — Kdb Users. 2 operations. Lead operation: Amazon FinSpace Create kdb User. Self-contained
    Naftiko capability covering one Amazon Finspace business surface.'
  tags:
  - Amazon Finspace
  - Kdb Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_FINSPACE_API_KEY: AMAZON_FINSPACE_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-finspace-kdb-users
    baseUri: https://finspace.{region}.amazonaws.com
    description: Amazon FinSpace API — Kdb Users business capability. Self-contained, no shared references.
    resources:
    - name: kdb-environments-environmentId-users
      path: /kdb/environments/{environmentId}/users
      operations:
      - name: createkxuser
        method: POST
        description: Amazon FinSpace Create kdb User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: environmentId
          in: path
          type: string
          description: kdb environment ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listkxusers
        method: GET
        description: Amazon FinSpace List kdb Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: environmentId
          in: path
          type: string
          description: kdb environment ID
          required: true
        - name: nextToken
          in: query
          type: string
          description: Pagination token
        - name: maxResults
          in: query
          type: integer
          description: Max results
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_FINSPACE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-finspace-kdb-users-rest
    port: 8080
    description: REST adapter for Amazon FinSpace API — Kdb Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/kdb/environments/{environmentid}/users
      name: kdb-environments-environmentid-users
      description: REST surface for kdb-environments-environmentId-users.
      operations:
      - method: POST
        name: createkxuser
        description: Amazon FinSpace Create kdb User
        call: amazon-finspace-kdb-users.createkxuser
        with:
          environmentId: rest.environmentId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listkxusers
        description: Amazon FinSpace List kdb Users
        call: amazon-finspace-kdb-users.listkxusers
        with:
          environmentId: rest.environmentId
          nextToken: rest.nextToken
          maxResults: rest.maxResults
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-finspace-kdb-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon FinSpace API — Kdb Users. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: amazon-finspace-create-kdb-user
      description: Amazon FinSpace Create kdb User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-finspace-kdb-users.createkxuser
      with:
        environmentId: tools.environmentId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-finspace-list-kdb-users
      description: Amazon FinSpace List kdb Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-finspace-kdb-users.listkxusers
      with:
        environmentId: tools.environmentId
        nextToken: tools.nextToken
        maxResults: tools.maxResults
      outputParameters:
      - type: object
        mapping: $.
