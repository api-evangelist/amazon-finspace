naftiko: 1.0.0-alpha2
info:
  label: Amazon FinSpace API — Kdb Databases
  description: 'Amazon FinSpace API — Kdb Databases. 2 operations. Lead operation: Amazon FinSpace Create kdb Database. Self-contained
    Naftiko capability covering one Amazon Finspace business surface.'
  tags:
  - Amazon Finspace
  - Kdb Databases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_FINSPACE_API_KEY: AMAZON_FINSPACE_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-finspace-kdb-databases
    baseUri: https://finspace.{region}.amazonaws.com
    description: Amazon FinSpace API — Kdb Databases business capability. Self-contained, no shared references.
    resources:
    - name: kdb-environments-environmentId-databases
      path: /kdb/environments/{environmentId}/databases
      operations:
      - name: createkxdatabase
        method: POST
        description: Amazon FinSpace Create kdb Database
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: environmentId
          in: path
          type: string
          description: kdb environment ID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listkxdatabases
        method: GET
        description: Amazon FinSpace List kdb Databases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: environmentId
          in: path
          type: string
          description: kdb environment ID
          required: true
        - name: nextToken
          in: query
          type: string
          description: Pagination token
        - name: maxResults
          in: query
          type: integer
          description: Max results
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_FINSPACE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-finspace-kdb-databases-rest
    port: 8080
    description: REST adapter for Amazon FinSpace API — Kdb Databases. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/kdb/environments/{environmentid}/databases
      name: kdb-environments-environmentid-databases
      description: REST surface for kdb-environments-environmentId-databases.
      operations:
      - method: POST
        name: createkxdatabase
        description: Amazon FinSpace Create kdb Database
        call: amazon-finspace-kdb-databases.createkxdatabase
        with:
          environmentId: rest.environmentId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listkxdatabases
        description: Amazon FinSpace List kdb Databases
        call: amazon-finspace-kdb-databases.listkxdatabases
        with:
          environmentId: rest.environmentId
          nextToken: rest.nextToken
          maxResults: rest.maxResults
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-finspace-kdb-databases-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon FinSpace API — Kdb Databases. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-finspace-create-kdb-database
      description: Amazon FinSpace Create kdb Database
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-finspace-kdb-databases.createkxdatabase
      with:
        environmentId: tools.environmentId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-finspace-list-kdb-databases
      description: Amazon FinSpace List kdb Databases
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-finspace-kdb-databases.listkxdatabases
      with:
        environmentId: tools.environmentId
        nextToken: tools.nextToken
        maxResults: tools.maxResults
      outputParameters:
      - type: object
        mapping: $.
